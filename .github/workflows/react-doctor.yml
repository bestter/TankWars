name: React Doctor

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  statuses: write
  issues: write

concurrency:
  group: react-doctor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # L'Action GitHub officielle millionco/react-doctor@v2 s'exécute dans un environnement
      # non interactif (pas de blocage stdin) et dispose d'un accès réseau complet requis pour
      # calculer le score, publier le statut de commit (commit-status) et insérer les commentaires
      # de revue sur la PR. Les drapeaux CLI réservés aux environnements bac à sable locaux ou
      # agents (-y, --no-score, --no-supply-chain, --max-duration) ne s'y appliquent donc pas.
      - uses: millionco/react-doctor@v2
        with:
          version: latest
          blocking: warning
          scope: changed
